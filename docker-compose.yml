services:
  mariadb:
    image: mariadb:11
    container_name: abcerp-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: abcerpdb
      MARIADB_USER: admin
      MARIADB_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: abcerp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: abcerp-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080

      DB_URL: jdbc:mariadb://mariadb:3306/abcerpdb
      DB_USERNAME: admin
      DB_PASSWORD: admin

      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      HIBERNATE_FORMAT_SQL: "false"

      PERFORMANCE_LOGGING_ENABLED: "true"
      MEMBER_CACHE_ENABLED: "false"

      NOTICE_UPLOAD_PATH: /app/uploads/notice

      CORS_ALLOWED_ORIGIN: http://localhost:5173
      WEBSOCKET_ALLOWED_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - notice_uploads:/app/uploads/notice

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_SERVER: http://localhost:8080
    container_name: abcerp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mariadb_data:
  notice_uploads:
